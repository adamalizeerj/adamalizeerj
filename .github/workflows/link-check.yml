# Checks every link in README.md and fails if one is dead.
#
# WHY THIS EXISTS
#   A profile README is the first thing a reviewer opens, and a 404 on it is the
#   cheapest possible way to look careless. Repos get renamed, files get moved,
#   and nobody re-reads their own profile. This catches it on a schedule instead.
#
# WHAT IT CHECKS
#   Absolute http(s) links and relative paths that resolve inside this repository.
#   mailto: links are skipped (nothing to request). LinkedIn is skipped because it
#   serves 999 to unauthenticated bots, so a failure there would be noise, not signal.

name: Check README links

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
  schedule:
    # First of the month, 07:00 UTC.
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        run: python3 scripts/check_links.py README.md
